name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check initial repository files
        shell: bash
        run: |
          test -f README.md
          test -f .gitignore
          test -f .github/workflows/ci.yml
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|secrets/|client_data/|raw_traces/|production_traces/)'
      - name: Install JSON Schema validator
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'jsonschema==4.23.0'
          .venv/bin/python -m pip install -r requirements-image-ssim.txt
          .venv/bin/python -m pip install -r requirements-receiver-evidence.txt
      - name: Validate V0 contract schema and fixtures
        run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Measure deterministic-engine line coverage
        run: .venv/bin/python scripts/measure_engine_coverage.py
      - name: Measure lot 4 synthetic adversarial outcomes
        run: .venv/bin/python scripts/measure_lot4_adversarial.py
      - name: Build static Hugging Face demo from actual synthetic outcomes
        run: |
          .venv/bin/python scripts/build_lot6_demo.py
          test -s demo/dist/README.md
          test -s demo/dist/index.html
          test -s demo/dist/report.json
      - name: Verify static Space package and public dataset
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          root = Path("demo/dist")
          assert sorted(p.name for p in root.iterdir()) == ["README.md", "index.html", "report.json"]
          readme = (root/"README.md").read_text()
          html = (root/"index.html").read_text()
          report = json.loads((root/"report.json").read_text())
          assert readme.startswith("---\n") and "sdk: static" in readme and "app_file: index.html" in readme
          assert "fetch(\"./report.json\"" in html
          assert report["total_cases"] == 155 and len(report["cases"]) == 155
          assert report["counts"]["TP"] == 69 and report["counts"]["abstentions_unscored"] == 66
          assert len(report["source_commit"]) == 40
          assert not any("private_key" in p.name or "secret" in p.name for p in root.iterdir())
          PY
